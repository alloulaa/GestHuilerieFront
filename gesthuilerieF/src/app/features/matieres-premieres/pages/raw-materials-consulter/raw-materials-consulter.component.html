<nb-card class="surface-card">
  <nb-card-body>
    <div class="panel-head">
      <div>
        <h3>LISTE DES MATIERES PREMIERES </h3>
      </div>
      <span class="chip">Total: {{ rawMaterials.length }}</span>
    </div>

    <div class="filter-panel">
      <div class="filter-input-wrap">
        <label class="filter-label">Filtrer par nom d'huilerie</label>
        <input nbInput fullWidth [(ngModel)]="huilerieSearchNom" placeholder="Ex: Huilerie Nord"
          (keyup.enter)="applyHuilerieFilter()" />
      </div>
      <div class="filter-actions">
        <button nbButton status="primary" type="button" (click)="applyHuilerieFilter()">Filtrer</button>
        <button nbButton status="basic" outline type="button" (click)="resetHuilerieFilter()">Reinitialiser</button>
      </div>
    </div>


    <div class="table-wrap">
      <table class="crud-table">
        <thead>
          <tr>
            <th>Reference</th>
            <th>Nom</th>
            <th>Type</th>
            <th>Unite</th>
            <th>Description</th>

          </tr>
        </thead>
        <tbody>

          <tr *ngFor="let item of rawMaterials" class="row-hover">
            <td class="id-cell">{{ item.reference || (item.idMatierePremiere ? ('#' + item.idMatierePremiere) : '-') }}
            </td>
            <td>{{ item.nom }}</td>
            <td class="type-cell">{{ item.type }}</td>
            <td class="unit-cell">{{ item.uniteMesure }}</td>
            <td>{{ item.description }}</td>

          </tr>
        </tbody>
      </table>
    </div>
  </nb-card-body>
</nb-card>
